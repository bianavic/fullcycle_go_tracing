services:
  # Zipkin for trace visualization
  zipkin:
    image: openzipkin/zipkin:3.6.1
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9411/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      backend:
        aliases:
          - zipkin

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    depends_on:
      zipkin:
        condition: service_healthy
    networks:
      backend:
        aliases:
          - otel-collector

  # Service A - CEP validation and orchestration
  service-a:
    build:
      context: .
      dockerfile: ./service-a/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=service-a
      - OTEL_RESOURCE_ATTRIBUTES=environment=development,service.version=1.0.0
      - SERVICE_B_URL=http://service-b:8081
      - HTTP_CLIENT_TIMEOUT=${HTTP_CLIENT_TIMEOUT:-15s}
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      - backend

  # Service B - CEP lookup and weather data
  service-b:
    build:
      context: .
      dockerfile: ./service-b/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=service-b
      - OTEL_RESOURCE_ATTRIBUTES=environment=development,service.version=1.0.0
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      - backend

networks:
  backend:
    driver: bridge